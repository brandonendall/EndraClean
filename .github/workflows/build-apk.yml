name: Build EndraClean APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install approved Endra Hydra artwork
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl -L --fail -o app/src/main/res/drawable-nodpi/endra_hydra_home.webp https://raw.githubusercontent.com/brandonendall/EndraLink/9ae406d3ac13ec61a933c4bc1e551376fe20eba6/app/src/main/res/drawable-nodpi/hydra_home.webp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: EndraClean-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
